name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --legacy-peer-deps: npm 10 crashes resolving vitest's optional peers.
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
