name = "transfr-cf"
main = "src/index.ts"
compatibility_date = "2026-08-22"
workers_dev = true

# The HTML pages live in html/ and are bundled as text modules.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# Set bucket_name to the R2 bucket created with
# `wrangler r2 bucket create <name>`; the binding name has to match
# R2_DEFAULT_NAMESPACE below.
[[r2_buckets]]
binding = "TEMP_STORE_R2_1"
bucket_name = "transfr-temp-store"

[vars]
R2_DEFAULT_NAMESPACE = "TEMP_STORE_R2_1"
R2_MAX_FILE_SIZE_BYTES = "21000000" # 20 MB
R2_DEFAULT_FILE_TTL = "86400" # 24 hours
# Hosts that always serve the stored bytes instead of the HTML landing page.
RAW_ONLY_HOSTS = "bee.transfr.one"

[observability]
enabled = true
