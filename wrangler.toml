name = "transfr-cf"
main = "src/index.ts"
compatibility_date = "2026-08-22"
# So a pipe can notice when a side that was waiting has disconnected: the
# first reports a client disconnect on the request, the second carries it
# through the worker to the Durable Object. Best effort: local development
# does not report disconnects, so this is not covered by a test.
compatibility_flags = ["enable_request_signal", "request_signal_passthrough"]
workers_dev = true
# The live worker has Logpush on; a deploy without this would turn it off.
logpush = true

# The HTML pages and the plain text guide live in html/ and are bundled as
# text modules.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = false

# Scripts, stylesheet and fonts for the pages. Cloudflare serves a request
# that matches a file in here directly; everything else goes to the worker.
[assets]
directory = "./public"

# Set bucket_name to the R2 bucket created with
# `wrangler r2 bucket create <name>`; the binding name has to match
# R2_DEFAULT_NAMESPACE below.
[[r2_buckets]]
binding = "TEMP_STORE_R2_1"
bucket_name = "transfr-temp-bucket-2"

[vars]
R2_DEFAULT_NAMESPACE = "TEMP_STORE_R2_1"
# Uploads with a Content-Length stream straight to R2. Cloudflare rejects
# request bodies over 100 MB on the Free zone plan (200 MB Business, 500 MB
# Enterprise) before they reach the worker, so going higher has no effect.
R2_MAX_FILE_SIZE_BYTES = "100000000" # 100 MB (shown as 95 MB, in 1024-based units)
# Uploads without a Content-Length (chunked, e.g. `curl -T -`) are buffered in
# the Worker's 128 MB of memory, so they get a lower limit.
R2_MAX_BUFFERED_FILE_SIZE_BYTES = "21000000" # 20 MB
R2_DEFAULT_FILE_TTL = "604800" # 7 days, the same as the bucket lifecycle rule
# Hosts that always serve the stored bytes instead of the HTML landing page.
RAW_ONLY_HOSTS = "bee.transfr.one"
# The address search engines should index. The landing page on any other host
# this worker answers on is marked noindex and points here. Deploying your own
# copy: set this to your address, or remove it.
CANONICAL_ORIGIN = "https://transfr.one"

# Pipes and streams: one Durable Object per pipe or stream connects the two
# sides, and stores a stream's bytes in its own SQLite database.
[[durable_objects.bindings]]
name = "CHANNELS"
class_name = "Channel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Channel"]

# Uploads, pipe sends and new streams a client may start per minute. Counted
# per Cloudflare location, so it is a brake on abuse, not an exact quota.
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "481516"
simple = { limit = 20, period = 60 }

# Writes to an existing stream: a script that logs a line at a time sends many
# more requests than someone uploading files.
[[ratelimits]]
name = "STREAM_WRITE_LIMITER"
namespace_id = "481517"
simple = { limit = 120, period = 60 }

[observability]
enabled = true
